<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宏观环境仪表盘 · Global Macro Dashboard</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --txt:#c9d1d9; --muted:#8b949e; --accent:#e0c068; --up:#ff5050; --down:#00c864; --neu:#e0c068; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:20px; max-width:1080px; margin:0 auto; line-height:1.6; }
h1 { font-size:1.3rem; margin-bottom:2px; }
.sub { color:var(--muted); font-size:.78rem; margin-bottom:14px; }
section { margin-bottom:22px; }
section > h2 { font-size:1rem; color:var(--accent); margin-bottom:10px; border-left:3px solid var(--accent); padding-left:8px; }
.pos { color:var(--up); } .neg { color:var(--down); } .neu { color:var(--neu); }
/* 顶部结论 */
.verdict { border-radius:10px; padding:16px 18px; margin-bottom:16px; border:1px solid var(--border); background:var(--card); }
.verdict.warn { border-color:var(--up); background:#1a1215; }
.verdict .big { font-size:1.05rem; font-weight:600; margin-bottom:6px; }
.verdict .detail { font-size:.85rem; color:#adbac7; }
.pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.72rem; margin-right:6px; background:#21262d; }
.pill.risk { background:#2a1518; color:var(--up); }
/* 美林时钟 */
.clock { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; background:#30363d; border-radius:10px; overflow:hidden; }
.q { background:var(--card); padding:16px 14px; min-height:110px; }
.q.active { outline:2px solid var(--up); outline-offset:-2px; background:#1a1215; }
.q .qn { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
.q .qa { font-size:.82rem; color:var(--muted); }
.q .tag { display:inline-block; margin-top:6px; font-size:.68rem; padding:1px 8px; border-radius:8px; background:#2a1518; color:var(--up); }
.clock-label { display:flex; gap:16px; margin-top:8px; font-size:.72rem; color:var(--muted); flex-wrap:wrap; }
/* 大类资产 */
.asset-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.asset { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.asset .an { font-size:.78rem; color:var(--muted); margin-bottom:2px; }
.asset .av { font-size:1.05rem; font-weight:700; }
.asset .ach { font-size:.78rem; margin-top:2px; }
.asset .bar { height:4px; background:#21262d; border-radius:2px; margin-top:6px; overflow:hidden; }
.asset .bar i { display:block; height:100%; }
.asset-concl { margin-top:10px; font-size:.82rem; color:#adbac7; }
.deviation { margin-top:12px; padding:10px 14px; border-left:3px solid var(--accent); background:#161b22; border-radius:0 6px 6px 0; font-size:.82rem; color:#adbac7; line-height:1.7; }
.deviation b { color:var(--accent); }
/* 四驱动 */
.drv-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.drv { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; transition:border-color .15s; }
.drv:hover { border-color:#58a6ff; }
.drv .head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.drv .icon { font-size:1.1rem; }
.drv .name { font-size:.82rem; color:var(--muted); }
.drv .dir { font-size:.75rem; font-weight:700; padding:1px 8px; border-radius:8px; }
.drv .dir.利多 { background:#2a1518; color:var(--up); }
.drv .dir.利空 { background:#12241a; color:var(--down); }
.drv .dir.中性 { background:#262015; color:var(--neu); }
.drv .trend { font-size:.72rem; color:var(--muted); }
.drv .concl { font-size:1rem; font-weight:700; margin-bottom:8px; }
.drv .ev { font-size:.8rem; color:#adbac7; margin-top:3px; display:flex; align-items:baseline; gap:6px; }
.drv .ev .arrow { font-weight:700; }
.drv .ev b { font-weight:700; }
.drv .hint { font-size:.7rem; color:#6e7681; margin-top:6px; }
/* 预警 */
.alert-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:.82rem; margin-bottom:8px; }
.alert-item b { color:var(--warn); }
/* 观点层 */
.prop { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.prop .ptopic { font-size:.95rem; font-weight:700; color:var(--accent); margin-bottom:4px; }
.prop .pfact { font-size:.78rem; color:#8b949e; margin-bottom:8px; }
.prop .pbar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:#21262d; margin-bottom:6px; }
.prop .pbar .bull { background:#ff5050; height:100%; }
.prop .pbar .bear { background:#00c864; height:100%; }
.prop .pconsensus { font-size:.82rem; margin-bottom:8px; }
.prop .pstances { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.stance { background:#0d1117; border-radius:6px; padding:8px 10px; font-size:.75rem; }
.stance .tier { display:inline-block; font-size:.62rem; padding:1px 6px; border-radius:6px; background:#21262d; color:#8b949e; margin-right:4px; }
.stance .tag { font-weight:700; margin-left:4px; }
.stance .date { color:#6e7681; font-size:.68rem; margin-left:4px; }
.stance .note { color:#adbac7; margin-top:3px; line-height:1.5; }
/* 弹窗 */
.mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:99; }
.modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); border:1px solid var(--border); border-radius:12px; width:min(700px,92vw); max-height:82vh; overflow:auto; padding:18px; z-index:100; }
.modal h3 { font-size:.95rem; color:var(--accent); margin-bottom:8px; padding-right:24px; }
.modal .close { position:absolute; top:10px; right:14px; cursor:pointer; color:var(--muted); font-size:1.3rem; }
.modal .close:hover { color:#fff; }
.modal .mmeta { font-size:.8rem; color:#adbac7; margin:6px 0; line-height:1.7; }
.modal .mchart { width:100%; height:300px; }
@media (max-width:760px) { .drv-grid,.asset-grid,.clock,.pstances { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>🌐 宏观环境仪表盘</h1>
<div class="sub" id="subTitle">加载中…</div>
<div class="verdict" id="verdict"></div>

<section><h2>一、大类资产轮动（美林时钟）</h2>
  <div class="clock" id="clock"></div>
  <div class="clock-label" id="clockLabel"></div>
</section>

<section><h2>二、大类资产轮动（股·债·商·金 · 资产属性+驱动 · 近1月）</h2>
  <div class="asset-grid" id="assetGrid"></div>
  <div class="asset-concl" id="assetConcl"></div>
</section>

<section><h2>三、四驱动详解（点击看方向趋势评估）</h2>
  <div class="drv-grid" id="drvGrid"></div>
</section>

<section id="alertSec" style="display:none"><h2>四、相变预警</h2>
  <div id="alertList"></div>
</section>

<section id="opinionSec"><h2>五、观点层（分层信源 · 共识度 · 事实 vs 观点偏差）</h2>
  <div id="opinionGrid"></div>
</section>

<div class="mask" id="mask"></div>
<div class="modal" id="modal">
  <span class="close" onclick="closeModal()">✕</span>
  <h3 id="mTitle"></h3>
  <div class="mmeta" id="mMeta"></div>
  <div class="mchart" id="mChart"></div>
</div>

<script src="echarts.min.js"></script>
<script>
let DATA=null;
const UP='#ff5050', DOWN='#00c864', NEU='#e0c068';
const DRV={growth:{icon:'📈',name:'增长'},inflation:{icon:'🔥',name:'通胀'},liquidity:{icon:'💧',name:'流动性'},risk_appetite:{icon:'🎢',name:'风险偏好'}};
const READ={
  us_ism_pmi:{name:'美国ISM制造业PMI',unit:'指数',desc:'荣枯线50。54.5扩张，但7月55.6→9月54.5连续回落，动能衰减。',dir:'up'},
  cn_pmi:{name:'中国官方制造业PMI',unit:'指数',desc:'荣枯线50。49.3跌破荣枯线，中国制造业收缩。',dir:'up'},
  us_cpi:{name:'美国CPI同比',unit:'%',desc:'3.7%上行，再通胀压力，利多抗通胀商品。',dir:'up'},
  cn_cpi:{name:'中国CPI同比',unit:'%',desc:'0.9%温和，需求偏弱。',dir:'up'},
  cn_ppi:{name:'中国PPI同比',unit:'%',desc:'5%从通缩转正上行，工业品再通胀。',dir:'up'},
  cn_m2:{name:'中国M2同比',unit:'%',desc:'7.2%下行，货币增速放缓。',dir:'up'},
  us_10y:{name:'美国10Y国债',unit:'%',desc:'4.94%高企，压制风险资产估值。',dir:'down'},
  cn_10y:{name:'中国10Y国债',unit:'%',desc:'1.65%低位，中美利差倒挂→资本外流。',dir:'down'},
  vix:{name:'VIX恐慌指数',unit:'指数',desc:'19.4上行，>20偏高。上行=避险升温。',dir:'down'},
  us_hy_oas:{name:'美国高收益债利差',unit:'%',desc:'3.26%走阔=信用风险升温、风险偏好下降。',dir:'down'},
  usdcny:{name:'美元兑人民币',unit:'元',desc:'6.71，人民币偏强。',dir:'down'},
  sh_index:{name:'上证指数',unit:'点',desc:'3599，A股表现。',dir:'up'},
  sp500:{name:'标普500',unit:'点',desc:'美股综合指数。',dir:'up'},
  nanhua:{name:'南华商品指数',unit:'点',desc:'中国商品综合指数。',dir:'up'},
  crb:{name:'CRB商品指数',unit:'点',desc:'全球商品综合指数。',dir:'up'},
  gold:{name:'伦敦现货黄金',unit:'美元/盎司',desc:'实际利率镜像，正实际利率压制金价。',dir:'down'},
  dxy:{name:'美元指数DXY',unit:'指数',desc:'美元强弱，美元走强压制金价。',dir:'down'},
  gold_reserve:{name:'全球央行黄金储备',unit:'吨',desc:'央行持续购金=长期利多黄金。',dir:'up'},
  us_3m:{name:'美国3月国债',unit:'%',desc:'现金收益率(年化)。',dir:'up'},
  cn_3m:{name:'中国3月国债',unit:'%',desc:'现金收益率(年化)。',dir:'up'},
};
const DRV_ITEMS={ growth:['us_ism_pmi','cn_pmi'], inflation:['us_cpi','cn_ppi'], liquidity:['cn_m2','us_10y'], risk_appetite:['us_hy_oas','vix'] };

function normDate(d){const s=String(d||'');const m=s.match(/(\d{4})年(\d{1,2})月/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}`;return s.slice(0,7);}
function pick(key){return (DATA.series[key]||[]).map(x=>[normDate(x[0]),x[1]]);}
function val(key){const s=DATA.series[key];return s&&s.length?s[s.length-1][1]:null;}
function ytdPct(key){const s=DATA.series[key];if(!s||s.length<2)return null;const jan=s.filter(x=>String(x[0]).slice(0,7)==='2026-01');const base=jan.length?jan[jan.length-1][1]:s[0][1];const last=s[s.length-1][1];return base? (last-base)/base*100 : null;}
function monthPct(key){const s=DATA.series[key];if(!s||s.length<22)return null;const last=s[s.length-1][1],base=s[s.length-21][1];return base?(last-base)/base*100:null;}
function fmt(v,n=1){return v==null?'—':Number(v).toFixed(n);}
function sign(v){return v==null?'':(v>0?'+':'')+fmt(v);}

async function load(){
  const [env,latest,series,opinions]=await Promise.all([
    fetch('data/macro_env.json?t='+Date.now()).then(r=>r.json()),
    fetch('data/macro_latest.json?t='+Date.now()).then(r=>r.json()),
    fetch('data/macro_series.json?t='+Date.now()).then(r=>r.json()),
    fetch('data/opinions.json?t='+Date.now()).then(r=>r.json()).catch(()=>({propositions:[]})),
  ]);
  DATA={env,latest,series,opinions};
  document.getElementById('subTitle').textContent=`数据截至 ${env.generated} · 统一底座每日自动更新 · 尺度：月度景气（当前值+近1月趋势），全页宏观评估与资产比较同此尺度，不混用其他尺度`;
  renderVerdict(); renderClock(); renderAssets(); renderDrivers(); renderAlerts(); renderOpinions();
}

function renderVerdict(){
  const env=DATA.env,al=env.alerts,rg=env.regime,d=env.drivers,warn=al.phase_warning;
  const el=document.getElementById('verdict');
  el.className='verdict'+(warn?' warn':'');
  el.innerHTML=`<div class="big">${warn?'⚠️ ':'✅ '}当前宏观环境处于【${rg.quadrant}】象限：增长动能衰减 + 再通胀升温。对商品：通胀利多，但需求（中国）偏弱 + 风险偏好转弱，需防流动性冲击。</div>`+
    `<div class="detail">资产配置：<b>${rg.assets}</b>　·　增长[${d.growth.state}]　通胀[${d.inflation.state}]　流动性[${d.liquidity.state}]　风险偏好[${d.risk_appetite.state}]`+
    (warn?`　<span class="pill risk">相变预警：${al.lead_signals.join('、')}</span>`:`　<span class="pill">无相变前兆</span>`)+`</div>`;
}

function renderClock(){
  const rg=DATA.env.regime;
  const quads={滞胀:{c:'#ffa198',a:'现金 > 商品 > 债券 > 股票',d:'增长弱+通胀高，现金为王、商品次之'},过热:{c:'#ff7b72',a:'商品 > 股票 > 现金 > 债券',d:'增长强+通胀高，商品最受益'},衰退:{c:'#79c0ff',a:'债券 > 现金 > 股票 > 商品',d:'增长弱+通胀低，避险为主'},复苏:{c:'#3fb950',a:'股票 > 债券 > 现金 > 商品',d:'增长强+通胀低，股票最佳'}};
  const layout=['滞胀','过热','衰退','复苏'];
  document.getElementById('clock').innerHTML=layout.map(id=>{const q=quads[id];const on=id===rg.quadrant;
    return`<div class="q ${on?'active':''}" style="color:${q.c}"><div class="qn">${id}</div><div class="qa">${q.a}</div>${on?'<span class="tag">⬅ 当前位置</span>':''}</div>`;}).join('');
  document.getElementById('clockLabel').innerHTML=`<span>横轴=增长(右强左弱) · 纵轴=通胀(上高下低)</span><span>当前：<b>${rg.quadrant}</b> — ${quads[rg.quadrant].d}</span>`;
}

// 大类资产：明确资产属性 + 驱动，月度景气尺度（近1月），与宏观评估同尺度
const ASSET_CLASSES=[
  {label:'股票',attr:'风险资产',drv:'驱动=增长/盈利',type:'pct',items:[{key:'sh_index',name:'上证',r:'中国'},{key:'sp500',name:'标普',r:'美国'}]},
  {label:'债券',attr:'利率资产',drv:'驱动=利率/避险',type:'pct',items:[{key:'cn_10y',name:'中债',r:'中国',inv:1},{key:'us_10y',name:'美债',r:'美国',inv:1}]},
  {label:'商品',attr:'实物资产',drv:'驱动=供需/通胀',type:'pct',items:[{key:'nanhua',name:'南华',r:'中国'},{key:'crb',name:'CRB',r:'全球'}]},
  {label:'黄金',attr:'实际利率镜像',drv:'驱动=实际利率/美元/央行购金',type:'gold',items:[{key:'gold',name:'伦敦金',r:'全球'}]},
  {label:'现金',attr:'货币资产',drv:'驱动=短期利率/政策利率',type:'cash',items:[{key:'us_3m',name:'美现金',r:'美国'},{key:'cn_3m',name:'中现金',r:'中国'}]},
];
function renderAssets(){
  const el=document.getElementById('assetGrid');
  el.innerHTML=ASSET_CLASSES.map(a=> a.type==='gold'?renderGold(a): a.type==='cash'?renderCash(a): renderPctAsset(a)).join('');
  document.getElementById('assetConcl').innerHTML=`<b>近1月轮动（月度景气尺度，与宏观评估同尺度）：</b>${assetConclText()}<div class="deviation">${assetDeviation()}</div>`;
}
function renderPctAsset(a){
  const items=a.items.map(it=>{
    const p=(it.inv?-1:1)*(monthPct(it.key)||0);
    const c=p>=0?'var(--up)':'var(--down)';
    return `<div class="ev" style="margin-top:3px">${it.r}·<b style="color:${c}">${it.name}</b> <b style="color:${c}">${sign(p)}%</b></div>`;
  }).join('');
  return `<div class="asset"><div class="an">${a.label} <span style="color:#6e7681;font-size:.72rem">${a.attr}</span></div>
    <div class="hint" style="font-size:.68rem;margin-top:2px">${a.drv}</div>${items}</div>`;
}
function renderGold(a){
  const p=monthPct('gold')||0, c=p>=0?'var(--up)':'var(--down)';
  const realRate=(val('us_10y')||0)-(val('us_cpi')||0);
  const dxy=val('dxy'), grYoy=goldReserveYoy();
  return `<div class="asset"><div class="an">${a.label} <span style="color:#6e7681;font-size:.72rem">${a.attr}</span></div>
    <div class="hint" style="font-size:.68rem;margin-top:2px">${a.drv}</div>
    <div class="ev" style="margin-top:3px">伦敦金 <b style="color:${c}">${sign(p)}%</b></div>
    <div class="ev" style="margin-top:2px;font-size:.72rem">实际利率 <b style="color:${realRate>0?'var(--down)':'var(--up)'}">${realRate.toFixed(2)}%</b>${realRate>0?'(正利率·压制)':'(负利率·利多)'}</div>
    <div class="ev" style="margin-top:2px;font-size:.72rem">美元指数 <b>${fmt(dxy)}</b>${dxy!=null?(dxy>100?'(偏强·压制)':'(偏弱·利多)'):''}</div>
    <div class="ev" style="margin-top:2px;font-size:.72rem">央行购金 <b style="color:${grYoy!=null&&grYoy>0?'var(--up)':'var(--down)'}">${grYoy!=null?sign(grYoy)+'%':'—'}</b> 同比</div>
  </div>`;
}
function renderCash(a){
  const items=a.items.map(it=>{
    const rate=val(it.key), m=(rate||0)/12, c=m>=0?'var(--up)':'var(--down)';
    return `<div class="ev" style="margin-top:3px">${it.r}·<b>${it.name}</b> 年化<b>${fmt(rate,2)}%</b> → 近1月<b style="color:${c}">${sign(m,2)}%</b></div>`;
  }).join('');
  return `<div class="asset"><div class="an">${a.label} <span style="color:#6e7681;font-size:.72rem">${a.attr}</span></div>
    <div class="hint" style="font-size:.68rem;margin-top:2px">${a.drv}（现金收益=利率水平，近1月≈年化/12）</div>${items}</div>`;
}
function goldReserveYoy(){
  const s=DATA.series['gold_reserve']||[];
  if(s.length<5)return null;
  const last=s[s.length-1][1], base=s[s.length-5][1];
  return base?(last-base)/base*100:null;
}
function assetConclText(){
  const rg=DATA.env.regime;
  const sh=monthPct('sh_index'), sp=monthPct('sp500'), bcn=-monthPct('cn_10y'), bus=-monthPct('us_10y'), nh=monthPct('nanhua'), cb=monthPct('crb'), au=monthPct('gold');
  const realRate=(val('us_10y')||0)-(val('us_cpi')||0);
  const us3m=val('us_3m'), cn3m=val('cn_3m'), grYoy=goldReserveYoy();
  const strong=[];
  if(sh>0)strong.push('A股'); if(sp>0)strong.push('美股'); if(bcn>0)strong.push('中债'); if(bus>0)strong.push('美债'); if(nh>0)strong.push('南华'); if(cb>0)strong.push('CRB'); if(au>0)strong.push('黄金');
  return `当前${rg.quadrant}象限，理论「${rg.assets}」。近1月：A股${sign(sh)}%、美股${sign(sp)}%、中债${sign(bcn)}%、美债${sign(bus)}%、南华${sign(nh)}%、CRB${sign(cb)}%、黄金${sign(au)}%、现金(美${fmt(us3m,2)}%/中${fmt(cn3m,2)}%年化)。`+
    (strong.length?`强势【${strong.join('、')}】。`:'')+
    `黄金定性：实际利率镜像（实际利率≈${realRate.toFixed(2)}%，${realRate>0?'正利率压制':'负利率利多'}），美元${fmt(val('dxy'))}，央行购金同比${grYoy!=null?sign(grYoy)+'%':'—'}持续增持。`;
}
// 模型 vs 现实偏差：美林时钟理论排序 vs 近1月实际表现（动态判断，不硬编码）
function assetDeviation(){
  const rg=DATA.env.regime;
  const sh=monthPct('sh_index'), sp=monthPct('sp500');
  const bcn=monthPct('cn_10y'), bus=monthPct('us_10y');
  const nh=monthPct('nanhua'), cb=monthPct('crb');
  const us3m=val('us_3m'), cn3m=val('cn_3m');
  const perf={
    '股票': Math.max(sh||-999, sp||-999),
    '债券': Math.max(-(bcn||0), -(bus||0)),
    '商品': Math.max(nh||-999, cb||-999),
    '现金': Math.max((us3m||0)/12, (cn3m||0)/12),
  };
  const theoryOrder={'复苏':['股票','债券','现金','商品'],'过热':['商品','股票','现金','债券'],'滞胀':['现金','商品','债券','股票'],'衰退':['债券','现金','股票','商品']}[rg.quadrant]||[];
  const actualRank=Object.entries(perf).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const theoryFirst=theoryOrder[0], actualFirst=actualRank[0];
  const theoryIdx=theoryOrder.indexOf(actualFirst);
  if(actualFirst===theoryFirst){
    return `✅ 模型与市场一致：${rg.quadrant}象限理论首选「${theoryFirst}」，近1月实际最强也是「${actualFirst}」，无错位。`;
  }
  const pos=theoryIdx>=0?`（理论排序第${theoryIdx+1}位）`:'';
  let meaning='';
  if(rg.quadrant==='滞胀' && actualFirst==='债券'){
    meaning='滞胀理论里债券本应弱（通胀高侵蚀债券实际收益），但近1月债券反而最强，说明市场定价的是「滞」（增长弱→避险→买债）而非「胀」（通胀高→卖债），正在抢跑「滞胀偏滞/衰退」逻辑，比时钟定位更悲观、更避险。';
  } else if(rg.quadrant==='衰退' && actualFirst==='现金'){
    meaning='衰退理论里现金本应排第二、债券第一，市场却更偏好现金而非债券，说明避险情绪极端、流动性偏好超过了对利率下行的博弈，恐慌程度高于时钟定位。';
  } else {
    meaning='实际最强资产与理论首选错位，市场定价领先于美林时钟的静态分类。';
  }
  return `⚠️ 模型 vs 现实偏差：${rg.quadrant}象限理论首选「${theoryFirst}」，但近1月实际最强是「${actualFirst}」${pos}。${meaning}`;
}

// 四驱动：结论 + 方向 + 趋势 + 论据（颜色联动）
function renderDrivers(){
  const env=DATA.env;
  const conclMap={
    growth:{txt:'美热中冷，需求偏弱',note:'商品最大买家是中国，中国收缩→商品需求偏弱。'},
    inflation:{txt:'再通胀升温，利多商品',note:'通胀上行，商品抗通胀属性受益。'},
    liquidity:{txt:'中性偏紧，资本外流压力',note:'中美利差倒挂，人民币和A股承压。'},
    risk_appetite:{txt:'risk-off 前兆，谨慎',note:'信用利差走阔+VIX上行=风险偏好转弱，流动性冲击前兆。'},
  };
  document.getElementById('drvGrid').innerHTML=Object.keys(DRV).map(k=>{
    const d=env.drivers[k], c=conclMap[k];
    const evs=DRV_ITEMS[k].map(key=>{
      const r=READ[key]||{name:key,unit:''}; const v=val(key);
      // 论据方向：指标对"该驱动利多"的方向
      const good = (key==='us_hy_oas'||key==='vix'||key==='us_10y') ? false : true; // 这些指标越高越不利
      const arr = good ? (v!=null?'':'') : '';
      const color = good ? (v!=null? (key==='cn_pmi'&&v<50?'neg':(key==='us_ism_pmi'&&v<50?'neg':'pos')) : 'neu') : 'neg';
      return`<div class="ev">· ${r.name}：<b style="color:${color}">${fmt(v)}${r.unit||''}</b> <span class="arrow" style="color:${color}">${evArrow(key,v)}</span></div>`;
    }).join('');
    return`<div class="drv" onclick="showDriver('${k}')">
      <div class="head"><span class="icon">${DRV[k].icon}</span><span class="name">${DRV[k].name}</span>
        <span class="dir ${d.direction}">${d.direction}</span><span class="trend">${d.trend||''}</span></div>
      <div class="concl">${c.txt}</div>
      ${evs}
      <div class="hint">${c.note}</div>
    </div>`;
  }).join('');
}
// 论据方向箭头（让用户看懂每个数据是利多还是利空）
function evArrow(key,v){
  if(v==null)return'';
  if(key==='us_ism_pmi')return v>=50?'利多↑':'利空↓';
  if(key==='cn_pmi')return v>=50?'利多↑':'利空↓';
  if(key==='us_cpi'||key==='cn_ppi')return v>=2?'利多商品↑':'';
  if(key==='cn_m2')return v>=8?'宽松':'偏紧';
  if(key==='us_10y')return v>=4.5?'压制资产↓':'';
  if(key==='us_hy_oas')return v>=3?'风险↑':'';
  if(key==='vix')return v>=20?'恐慌↑':'';
  return'';
}

function renderAlerts(){
  const al=DATA.env.alerts;
  if(!al.phase_warning){document.getElementById('alertSec').style.display='none';return;}
  document.getElementById('alertSec').style.display='block';
  document.getElementById('alertList').innerHTML=al.alerts.map(a=>`<div class="alert-item"><b>${a.signal}</b> — ${a.level}</div>`).join('')+
    `<div class="alert-item" style="border-color:#ff5050">综合含义：多个领先指标同步拐头，风险偏好正从 risk-on 转向 risk-off，警惕去杠杆螺旋与流动性冲击。</div>`;
}

// 观点层：分层信源立场 + 共识度量化 + 事实vs观点偏差（共识一致=拥挤交易相变前兆）
const PROP_LABEL={
  us_inflation:{bull:'通胀持续',bear:'通胀暂时'},
  us_recession:{bull:'衰退风险',bear:'软着陆'},
  fed_rate_path:{bull:'利率高位/加息',bear:'降息'},
};
function renderOpinions(){
  const ops=(DATA.opinions&&DATA.opinions.propositions)||[];
  if(!ops.length){document.getElementById('opinionSec').style.display='none';return;}
  document.getElementById('opinionSec').style.display='block';
  document.getElementById('opinionGrid').innerHTML=ops.map(p=>{
    const L=PROP_LABEL[p.id]||{bull:'偏多',bear:'偏空'};
    const bull=p.stances.filter(s=>s.score>0);
    const bear=p.stances.filter(s=>s.score<0);
    const total=p.stances.length||1;
    const bullPct=Math.round(bull.length/total*100), bearPct=Math.round(bear.length/total*100);
    const maxPct=Math.max(bullPct,bearPct);
    const consensus=maxPct>=80?'<b style="color:#ff5050">共识一致(拥挤预警)</b>':maxPct>=60?'<b style="color:#d2a850">偏一致</b>':'<b style="color:#e0c068">分歧</b>';
    const viewDir=bull.length>bear.length?1:(bull.length<bear.length?-1:0);
    let dev;
    if(viewDir===0) dev='⚠️ 观点分歧、无共识，方向待定';
    else if(p.fact_dir===viewDir) dev='✅ 事实层与主流观点同向';
    else dev='⚠️ <b>事实层与主流观点背离</b>：数据/政策偏'+(p.fact_dir>0?'鹰(红)':'鸽(绿)')+'，主流观点偏'+(viewDir>0?'鹰':'鸽');
    const stancesHtml=p.stances.map(s=>{
      const c=s.score>0?'#ff5050':s.score<0?'#00c864':'#e0c068';
      const tag=s.score>0?L.bull:s.score<0?L.bear:'中性';
      return `<div class="stance"><span class="tier">${s.tier}</span><b>${s.source}</b><span class="tag" style="color:${c}">${tag}</span><span class="date">${s.date}</span><div class="note">${s.note}</div></div>`;
    }).join('');
    return `<div class="prop">
      <div class="ptopic">${p.topic}</div>
      <div class="pfact">${p.fact}</div>
      <div class="pbar"><div class="bull" style="width:${bullPct}%"></div><div class="bear" style="width:${bearPct}%"></div></div>
      <div class="pconsensus">共识度 ${bullPct}% vs ${bearPct}% → ${consensus}　${dev}</div>
      <div class="pstances">${stancesHtml}</div>
    </div>`;
  }).join('');
}

// 弹窗：方向趋势评估 + 趋势图
let _chart=null;
function showDriver(k){
  const d=DATA.env.drivers[k];
  const title=`${DRV[k].icon} ${DRV[k].name} — ${d.direction}（${d.trend||'稳定'}）`;
  document.getElementById('mTitle').textContent=title;
  const items=DRV_ITEMS[k];
  document.getElementById('mMeta').innerHTML=
    `<b>方向趋势评估：</b>当前<b class="${d.direction==='利多'?'pos':d.direction==='利空'?'neg':'neu'}">${d.direction}</b>，趋势<b>${d.trend||'稳定'}</b>。<br>`+
    `<b>信号：</b>${(d.signals||[]).join('、')}<br>`+
    `<b>轨迹：</b>${d.trajectory||'—'}`+(d.cn_us_spread?`<br><b>中美利差：</b>${d.cn_us_spread}%（${d.spread_note}）`:'')+
    `<div class="hint" style="color:#6e7681;margin-top:6px">下图：${items.map(i=>READ[i].name).join(' vs ')}近一年走势，看方向与趋势。</div>`;
  openModal();                 // 先显示容器，再渲染图表——否则 echarts 在 display:none 里拿到 0 尺寸
  drawDriverChart(items);
}
function drawDriverChart(items){
  const el=document.getElementById('mChart');
  if(_chart){ try{_chart.dispose();}catch(e){} _chart=null; }
  el.innerHTML='';
  void el.offsetWidth;         // 强制 reflow，确保容器尺寸生效
  _chart=echarts.init(el,'dark');
  _chart.resize();             // init 时可能仍读不到容器宽度(display:none 残留)，显式 resize 强制按当前尺寸渲染
  const LINE_COLOR={us_ism_pmi:'#ff5050',cn_pmi:'#58a6ff',us_cpi:'#ffa657',cn_ppi:'#39c5cf',cn_m2:'#00c864',us_10y:'#e0c068',us_hy_oas:'#d2a8ff',vix:'#ff7b72'};
  const series=items.map(key=>({key,name:READ[key].name,data:pick(key).slice(-60),color:LINE_COLOR[key]||UP}));
  // 两指标量级差 >3 倍时启用双 Y 轴（如 VIX 19 vs 信用利差 3.26）
  const absMax=s=>s.data.reduce((m,x)=>Math.max(m,Math.abs(x[1]||0)),0);
  const maxs=series.map(absMax);
  const mx=Math.max(...maxs), mn=Math.min(...maxs.filter(v=>v>0));
  const dual=mx/(mn||1)>3;
  _chart.setOption({
    tooltip:{trigger:'axis'}, legend:{top:0,textStyle:{color:'#c9d1d9',fontSize:10}},
    grid:{left:46,right:dual?50:16,top:32,bottom:26},
    xAxis:{type:'category',data:series[0].data.map(x=>x[0]),axisLabel:{color:'#6e7681',fontSize:8,hideOverlap:true}},
    yAxis:dual?[
      {type:'value',scale:true,axisLabel:{color:'#6e7681',fontSize:8},splitLine:{lineStyle:{color:'#21262d'}}},
      {type:'value',scale:true,axisLabel:{color:'#6e7681',fontSize:8},splitLine:{show:false}},
    ]:{type:'value',scale:true,axisLabel:{color:'#6e7681',fontSize:8},splitLine:{lineStyle:{color:'#21262d'}}},
    series:series.map((s,i)=>({name:s.name,type:'line',data:s.data.map(x=>x[1]),smooth:true,showSymbol:false,yAxisIndex:(dual&&i>0)?1:0,lineStyle:{color:s.color,width:2},itemStyle:{color:s.color}})),
  });
}
function openModal(){document.getElementById('mask').style.display='block';document.getElementById('modal').style.display='block';}
function closeModal(){document.getElementById('mask').style.display='none';document.getElementById('modal').style.display='none';}
document.getElementById('mask').addEventListener('click',closeModal);

load();
</script>
