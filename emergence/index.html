<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🌊 全品种涌现状态扫描盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.2rem; }
h1 { font-size: 1.5rem; color: #e6edf3; margin-bottom: 0.3rem; }
.sub { color: #8b949e; font-size: 0.82rem; margin-bottom: 1rem; }
h2 { font-size: 1.1rem; color: #e0c068; margin: 1.8rem 0 0.6rem; padding-left: 0.6rem; border-left: 4px solid #e0c068; }
.card { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 1rem 1.2rem; margin: 0.6rem 0; }
.up { color: #ff5050; } .down { color: #00c864; } .neu { color: #8b949e; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th { background: #1f242c; color: #8b949e; text-align: left; padding: 0.5rem 0.6rem; font-weight: 600; border-bottom: 2px solid #30363d; white-space: nowrap; }
td { padding: 0.5rem 0.6rem; border-bottom: 1px solid #21262d; vertical-align: middle; }
tr:hover td { background: #1a2028; }
.badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 11px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.dir-long { background: #ff505022; color: #ff5050; }
.dir-short { background: #00c86422; color: #00c864; }
.dir-wait { background: #30363d; color: #8b949e; }
.crit-high { background: #ff505033; color: #ff7b72; }
.crit-mid { background: #f0b42922; color: #d29922; }
.crit-low { background: #30363d; color: #6e7681; }
.stage { color: #9da7b3; }
.driver { color: #8b949e; font-size: 0.75rem; line-height: 1.4; }
.sum-card { display: inline-block; vertical-align: top; width: 32%; margin-right: 1%; background: #1a2028; border: 1px solid #30363d; border-radius: 8px; padding: 0.8rem 1rem; }
.sum-card h3 { font-size: 0.85rem; margin-bottom: 0.4rem; }
.sum-card .item { font-size: 0.78rem; padding: 0.2rem 0; border-bottom: 1px dashed #21262d; }
.sum-card .item:last-child { border-bottom: none; }
.note { color: #6e7681; font-size: 0.76rem; margin-top: 0.8rem; line-height: 1.5; }
.update-time { float: right; color: #8b949e; font-size: 0.78rem; }
.pct-bar { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: #21262d; vertical-align: middle; margin-right: 5px; overflow: hidden; }
.pct-bar i { display: block; height: 100%; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌊 全品种涌现状态扫描盘 <span class="update-time" id="updTime"></span></h1>
  <div class="sub">28 个活跃品种 · 涌现时钟扫描 · 找出"跃迁前夜"的品种做轮动 · 数据每日自动更新</div>

  <div id="summaryBox"></div>

  <div id="sectors"></div>

  <div class="note">
    字段说明：<b>分位</b>=当前价在近3年历史区间的百分位（≥80高位/≤20低位）；<b>MA</b>=价格在 MA20/MA60 上(↑)下(↓)方；<b>临界度</b>=逼近相变的程度（高=脆弱，警惕双向暴动）；<b>方向</b>=涌现状态下的做多/做空/观望建议。<br>
    方法论：涌现视角五洞见——尺度分离(什么尺度看什么信号) · 临界相变(极端分位=相变标记) · 时滞传导(当下观察≠当下兑现) · 不可还原(因子加总≠结论) · 反馈环+肥尾(趋势跟随vs逆向，留相变后路)。
  </div>
</div>

<script>
function pctBar(p) {
  if (p == null) return '<span class="neu">—</span>';
  var color = p >= 80 ? '#ff5050' : (p <= 20 ? '#00c864' : '#8b949e');
  return '<span class="pct-bar"><i style="width:' + p + '%;background:' + color + '"></i></span>' + p;
}
function dirBadge(d) {
  if (!d) return '<span class="badge dir-wait">观望</span>';
  if (d.indexOf('做多') >= 0) return '<span class="badge dir-long">' + d + '</span>';
  if (d.indexOf('做空') >= 0) return '<span class="badge dir-short">' + d + '</span>';
  if (d.indexOf('警惕') >= 0) return '<span class="badge crit-high">' + d + '</span>';
  return '<span class="badge dir-wait">' + d + '</span>';
}
function critBadge(c) {
  return '<span class="badge crit-' + (c === '高' ? 'high' : (c === '中' ? 'mid' : 'low')) + '">' + c + '</span>';
}

fetch('emergence_scan.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updTime').textContent = '更新 ' + d.date;
    renderSummary(d.summary);
    renderSectors(d.commodities);
  })
  .catch(err => { document.getElementById('summaryBox').innerHTML = '❌ 数据加载失败：' + err.message; });

function renderSummary(s) {
  if (!s) return;
  var html = '<div class="card" style="background:#1a2028"><b style="color:#e0c068">📌 跃迁候选清单</b>';
  html += '<div style="margin-top:0.5rem"><div class="sum-card"><h3 class="up">🔴 做多候选 (' + (s.longs ? s.longs.length : 0) + ')</h3>';
  (s.longs || []).forEach(x => html += '<div class="item">' + x + '</div>');
  html += '</div><div class="sum-card"><h3 class="down">🟢 做空候选 (' + (s.shorts ? s.shorts.length : 0) + ')</h3>';
  (s.shorts || []).forEach(x => html += '<div class="item">' + x + '</div>');
  html += '</div><div class="sum-card"><h3 style="color:#d29922">⚠️ 相变警惕 (' + (s.alerts ? s.alerts.length : 0) + ')</h3>';
  (s.alerts || []).forEach(x => html += '<div class="item">' + x + '</div>');
  html += '</div></div>';
  html += '<div style="margin-top:0.6rem;font-size:0.82rem;color:#c9d1d9"><b style="color:#e0c068">综合：</b>' + (s.conclusion || '') + '</div></div>';
  document.getElementById('summaryBox').innerHTML = html;
}

function renderSectors(list) {
  var sectors = ['贵金属', '有色金属', '黑色系', '能源化工', '农产品', '新能源'];
  // 方向优先级排序
  var pri = { '做多(首选)': 0, '做多': 1, '做多(等回调)': 2, '观望偏多': 3, '观望': 4, '观望偏空': 5, '做空': 6, '做空(警惕反弹)': 7, '双向警惕': 8 };
  var html = '';
  sectors.forEach(function(sec) {
    var items = list.filter(c => c.sector === sec).sort(function(a, b) {
      return (pri[a.dir] != null ? pri[a.dir] : 5) - (pri[b.dir] != null ? pri[b.dir] : 5);
    });
    if (!items.length) return;
    html += '<h2>' + sec + '</h2><div class="card"><table><thead><tr>'
      + '<th>品种</th><th>最新价</th><th>3年分位</th><th>MA</th><th>20d动量</th><th>YTD</th>'
      + '<th>尺度周期</th><th>涌现阶段</th><th>临界</th><th>方向</th><th>驱动逻辑</th></tr></thead><tbody>';
    items.forEach(function(c) {
      if (c.error) { html += '<tr><td>' + c.name + '</td><td colspan=10 class="neu">获取失败</td></tr>'; return; }
      var ma = (c.above_ma20 ? '↑' : '↓') + (c.above_ma60 ? '↑' : '↓');
      html += '<tr>'
        + '<td><b>' + c.name + '</b></td>'
        + '<td>' + (c.latest != null ? c.latest.toLocaleString() : '—') + '</td>'
        + '<td>' + pctBar(c.pctile_3y) + '</td>'
        + '<td>' + ma + '</td>'
        + '<td class="' + (c.mom_20d >= 0 ? 'up' : 'down') + '">' + (c.mom_20d != null ? (c.mom_20d > 0 ? '+' : '') + c.mom_20d + '%' : '—') + '</td>'
        + '<td class="' + (c.ytd >= 0 ? 'up' : 'down') + '">' + (c.ytd != null ? (c.ytd > 0 ? '+' : '') + c.ytd + '%' : '—') + '</td>'
        + '<td class="stage">' + (c.scale || '') + '</td>'
        + '<td class="stage">' + (c.stage || '') + '</td>'
        + '<td>' + critBadge(c.crit) + '</td>'
        + '<td>' + dirBadge(c.dir) + '</td>'
        + '<td class="driver">' + (c.driver || '') + (c.note ? '<br><span style="color:#d29922">' + c.note + '</span>' : '') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  });
  document.getElementById('sectors').innerHTML = html;
}
</script>
</body>
</html>
